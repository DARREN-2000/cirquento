[project]
name = "cirquento"
version = "0.4.0"
description = "Circularity intelligence and Digital Product Passports for manufacturing supply chains."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Darren" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "duckdb>=1.1",
  "polars>=1.9",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "rapidfuzz>=3.10",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pypdf>=5.0",
  "weasyprint>=62",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27",
]

[project.optional-dependencies]
llm = ["openai>=1.51", "anthropic>=0.36", "langgraph>=0.2"]
mlops = ["mlflow>=2.16"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.12",
  "types-pyyaml",
]

[project.scripts]
cirquento = "cirquento.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirquento"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # asserts are fine in tests and narrowing

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
