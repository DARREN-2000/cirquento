name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The honest job: a bare Python interpreter, no packages, no API key, no
    # network. If this passes, "does it actually run?" is answered for anyone
    # who clones the repo, regardless of what their environment resolves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Seed, run, replay, test and gate with zero dependencies
        run: make verify
      - name: Fail if the published console drifted from the run
        # docs/data.js is generated. If `make verify` regenerated it into
        # something different from what was committed, the page in the repo was
        # showing numbers the engine no longer produces.
        run: git diff --exit-code -- docs/data.js

  quality:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: cirquento
          POSTGRES_DB: cirquento_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check src tests evals scripts
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Types
        run: uv run mypy --strict src
      - name: Tests with the full dependency set installed
        run: uv run pytest -q --cov=cirquento --cov-report=term-missing --cov-fail-under=70
        env:
          CIRQUENTO_DATABASE_URL: postgresql+asyncpg://postgres:cirquento@localhost:5432/cirquento_test

  eval-gate:
    # Prompt and model changes are treated like schema migrations: they must
    # prove they did not regress the golden set before they can merge.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Classification eval (offline replay, no API calls)
        run: PYTHONPATH=src python evals/run.py --report .data/eval_report.json
      - name: Enforce thresholds
        # A collapsing abstention rate is a failure too: a model that stops
        # saying "I don't know" pushes unverified data into regulated documents.
        # Fabricated evidence is rejected outright at any rate above zero.
        run: |
          PYTHONPATH=src python evals/gate.py \
            --report .data/eval_report.json \
            --min-f1 0.91 \
            --min-abstention 0.03 \
            --max-abstention 0.18 \
            --max-offtaxonomy 0.00
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: .data/eval_report.json

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cirquento/api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cirquento/api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'

  pages:
    # Publishes /docs (the live console) to GitHub Pages on main. The console's
    # numbers are regenerated from a real pipeline run immediately before
    # upload, so the published page can never show figures the engine did not
    # produce.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify, eval-gate]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate the console from a live run
        run: |
          make demo
          make console
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
